<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0E3D38" />
    <title>ExamBuddy — подготовка к IELTS</title>
    <!-- EX-2: официальный Telegram WebApp SDK. Грузится только с telegram.org, бандлить нельзя. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      /* Загрузчик — см. scripts/make-stand.mjs. Версию берём из assets/release.json,
         поэтому этот файл не меняется от выкатки к выкатке. */
      (function () {
        var forced = new URLSearchParams(window.location.search).get('r');
        function boot(build) {
          var v = forced || build || 'dev';
          window.__BUILD__ = build || 'dev';
          window.__BUILD_FORCED__ = Boolean(forced);
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './assets/app.css?v=' + encodeURIComponent(v);
          document.head.appendChild(link);
          var script = document.createElement('script');
          script.type = 'module';
          script.src = './assets/app.js?v=' + encodeURIComponent(v);
          document.head.appendChild(script);
        }
        fetch('./assets/release.json?ts=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (rel) { boot(rel && rel.build); })
          .catch(function () { boot(null); });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
